[package]
name = "rustcraft"
version = "0.1.0"
edition = "2021"

[lib]
name = "rustcraft"
crate-type = ["cdylib"]

[[bin]]
name = "rustcraft"
path = "src/main.rs"

[dependencies]
bevy = "0.14"
bevy_egui = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
strip = true

[package.metadata.android]
package = "com.rustcraft.client"
build_targets = ["aarch64-linux-android"]
[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 34
[package.metadata.android.application]
label = "RustCraft"
[package.metadata.android.application.activity]
orientation = "landscape"
