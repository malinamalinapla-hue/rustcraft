[package]
name = "rustcraft"
version = "0.1.0"
edition = "2021"

[lib]
name = "rustcraft"
crate-type = ["cdylib"]

[[bin]]
name = "rustcraft"
path = "src/main.rs"

[dependencies]
bevy = { version = "0.14", default-features = false, features = ["bevy_winit", "bevy_render", "bevy_core_pipeline", "android-native-activity", "multi-threaded", "x11"] }
bevy_egui = "0.28"
azalea = { git = "https://github.com/azalea-rs/azalea" }
tokio = { version = "1", features = ["rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
strip = true

[package.metadata.android]
package = "com.rustcraft.client"
build_targets = ["aarch64-linux-android"]
[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 34
[package.metadata.android.application]
label = "RustCraft"
[package.metadata.android.application.activity]
orientation = "landscape"
