name: Build APK
on: [push, workflow_dispatch]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with: { targets: aarch64-linux-android }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Android SDK
        run: |
          SM=$(find $ANDROID_HOME $ANDROID_SDK_ROOT /usr/local/lib/android -name sdkmanager -type f 2>/dev/null | head -n1)
          yes | $SM --licenses > /dev/null || true
          $SM "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
          ls $ANDROID_HOME/ndk
      - run: cargo install cargo-apk
      - run: cargo apk build --release --lib
      - uses: actions/upload-artifact@v4
        with: { name: rustcraft-apk, path: "**/release/apk/*.apk" }
